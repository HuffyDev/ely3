# WHITEHAT demo contracts. These are intentionally vulnerable and exist only to be
# deployed on a private local chain. Never deploy them to a live network.
[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
offline = true
# Sandbox note: if your solc binary cannot be downloaded, point `solc` at a local one:
solc = "/root/.local/bin/solc"

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 32
fail_on_revert = false
